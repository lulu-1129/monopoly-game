<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大富翁英文總複習 (English Monopoly Review Game)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter & Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Mammoth.js for Word (.docx) Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  
  <style>
    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background-color: #fefce8;
      user-select: none;
    }
    .dice-scene {
      width: 90px;
      height: 90px;
      perspective: 400px;
      cursor: pointer;
    }
    .dice-cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.2, 0.85, 0.32, 1.2);
    }
    .dice-face {
      position: absolute;
      width: 90px;
      height: 90px;
      background: #ffffff;
      border: 4px solid #1e293b;
      border-radius: 18px;
      font-size: 36px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.15), 0 8px 15px rgba(0,0,0,0.1);
    }
    .dice-face--1 { transform: rotateY(0deg) translateZ(45px); color: #ef4444; }
    .dice-face--2 { transform: rotateY(90deg) translateZ(45px); color: #3b82f6; }
    .dice-face--3 { transform: rotateY(180deg) translateZ(45px); color: #10b981; }
    .dice-face--4 { transform: rotateY(-90deg) translateZ(45px); color: #f59e0b; }
    .dice-face--5 { transform: rotateX(90deg) translateZ(45px); color: #8b5cf6; }
    .dice-face--6 { transform: rotateX(-90deg) translateZ(45px); color: #06b6d4; }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-center p-2 md:p-4">

  <!-- 1. 初始設定頁面 -->
  <div id="start-screen" class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl border-4 border-amber-300 p-6 md:p-8 flex flex-col items-center my-auto">
    <div class="text-center mb-6">
      <span class="inline-block px-4 py-1 bg-amber-100 text-amber-800 font-bold text-lg rounded-full mb-2">國小英文課堂複習神器 🎲</span>
      <h1 class="text-3xl md:text-5xl font-black text-amber-600 tracking-wide drop-shadow-sm">大富翁英文總複習</h1>
      <p class="text-slate-500 mt-2 font-medium">支援「題目含解答解析卷」全文解析與音檔自適應配對</p>
    </div>

    <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div class="bg-amber-50/80 p-5 rounded-2xl border-2 border-amber-200 flex flex-col justify-between">
        <h2 class="text-xl font-bold text-amber-900 mb-4 flex items-center gap-2">
          ⚙️ 遊戲規則與考卷匯入
        </h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">玩家人數 (2 ~ 5 人)</label>
            <select id="player-count-select" class="w-full p-3 bg-white border-2 border-amber-300 rounded-xl font-bold text-lg text-slate-800 focus:outline-none">
              <option value="2">2 位玩家</option>
              <option value="3" selected>3 位玩家</option>
              <option value="4">4 位玩家</option>
              <option value="5">5 位玩家</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">遊戲時間倒數 (分鐘)</label>
            <input type="number" id="game-time-input" min="3" max="30" value="10" class="w-full p-3 bg-white border-2 border-amber-300 rounded-xl font-bold text-lg text-slate-800">
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">玩家起始金額 ($)</label>
            <input type="number" id="start-money-input" min="400" max="1000" step="50" value="500" class="w-full p-3 bg-white border-2 border-amber-300 rounded-xl font-bold text-lg text-slate-800">
          </div>

          <!-- Word 考卷匯入 -->
          <div class="pt-2 border-t border-amber-200">
            <label class="block text-sm font-bold text-amber-900 mb-1 flex items-center justify-between">
              <span>📄 匯入 Word 考卷 (.docx)</span>
              <span class="text-xs text-amber-700 font-normal">全文自動辨識</span>
            </label>
            <label class="cursor-pointer bg-white hover:bg-amber-100 border-2 border-dashed border-amber-400 rounded-xl p-2.5 text-center transition flex items-center justify-center gap-2 text-amber-900 font-bold text-sm">
              <span>📁 選擇 Word 考卷 (.docx)</span>
              <input type="file" id="word-file-input" accept=".docx" class="hidden">
            </label>
          </div>

          <!-- 聽力音檔匯入 -->
          <div>
            <label class="block text-sm font-bold text-amber-900 mb-1 flex items-center justify-between">
              <span>🎧 匯入聽力音檔 (.mp3)</span>
              <span class="text-xs text-amber-700 font-normal">可多選檔案</span>
            </label>
            <div class="flex items-center gap-2">
              <label class="flex-1 cursor-pointer bg-white hover:bg-purple-50 border-2 border-dashed border-purple-400 rounded-xl p-2.5 text-center transition flex items-center justify-center gap-2 text-purple-900 font-bold text-sm">
                <span>🎵 選擇 MP3 音檔 (可多選)</span>
                <input type="file" id="mp3-files-input" accept="audio/*" multiple class="hidden">
              </label>
              <button id="reset-default-questions-btn" type="button" class="px-3 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">
                預設題庫
              </button>
            </div>
          </div>

          <!-- 狀態提示 -->
          <div id="import-summary-box" class="p-3 bg-amber-100/80 rounded-xl border border-amber-300 text-xs space-y-1">
            <p id="word-import-status" class="font-bold text-emerald-800">✅ 目前使用預設題庫</p>
            <p id="audio-import-status" class="text-slate-600 font-medium">🎧 聽力音檔：未上傳音檔</p>
          </div>
        </div>
      </div>

      <!-- 玩家角色選擇 -->
      <div class="bg-amber-50/80 p-5 rounded-2xl border-2 border-amber-200">
        <h2 class="text-xl font-bold text-amber-900 mb-4 flex items-center gap-2">
          👤 玩家角色選擇
        </h2>
        <div id="player-inputs-container" class="space-y-3 max-h-[360px] overflow-y-auto pr-2"></div>
      </div>
    </div>

    <button id="start-game-btn" class="w-full max-w-md py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-black text-2xl rounded-2xl shadow-xl border-b-4 border-emerald-700 transition flex items-center justify-center gap-3">
      🚀 開始大富翁遊戲！
    </button>
  </div>

  <!-- 2. 地圖主畫面 -->
  <div id="game-screen" class="hidden w-full max-w-6xl h-full flex-col items-center my-auto">
    <div class="w-full bg-white rounded-2xl shadow-md border-2 border-amber-300 p-3 mb-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div id="current-player-badge" class="px-4 py-2 rounded-xl text-white font-bold text-lg flex items-center gap-2 shadow"></div>
        <div id="round-indicator" class="text-sm font-bold text-slate-500">輪到你擲骰子囉！</div>
      </div>
      <div class="flex items-center gap-2 bg-rose-100 text-rose-700 px-4 py-2 rounded-xl border border-rose-300 font-black text-xl">
        ⏱️ 剩餘時間：<span id="timer-display">10:00</span>
      </div>
    </div>

    <!-- 6x6 地圖環狀 -->
    <div class="w-full aspect-square max-w-[820px] bg-amber-100/60 p-2 rounded-3xl border-4 border-amber-300 shadow-2xl relative">
      <div id="board-grid" class="w-full h-full grid grid-cols-6 grid-rows-6 gap-1.5 md:gap-2"></div>

      <div class="absolute inset-[17%] bg-white/95 backdrop-blur-sm rounded-2xl border-2 border-amber-200 shadow-inner p-3 md:p-4 flex flex-col justify-between items-center overflow-hidden">
        <div class="w-full flex flex-col items-center">
          <div id="players-dashboard" class="w-full flex justify-center gap-2 flex-wrap mb-2"></div>
        </div>

        <div class="flex flex-col items-center justify-center my-auto">
          <div id="dice-container" class="dice-scene" title="點擊骰子！">
            <div id="dice-cube" class="dice-cube">
              <div class="dice-face dice-face--1">1</div>
              <div class="dice-face dice-face--2">2</div>
              <div class="dice-face dice-face--3">3</div>
              <div class="dice-face dice-face--4">4</div>
              <div class="dice-face dice-face--5">5</div>
              <div class="dice-face dice-face--6">6</div>
            </div>
          </div>
          <p id="dice-hint" class="text-xs md:text-sm font-bold text-amber-700 mt-2 bg-amber-100 px-3 py-1 rounded-full animate-bounce">
            👇 點擊 3D 骰子擲點
          </p>
        </div>

        <div class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 h-20 overflow-y-auto text-xs md:text-sm text-slate-700 font-medium shadow-inner" id="game-log">
          <div class="text-emerald-600 font-bold">🎮 遊戲正式開始！</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 題目彈窗 -->
  <div id="question-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl border-4 border-amber-400 w-full max-w-2xl overflow-hidden flex flex-col max-h-[92vh]">
      <div class="bg-amber-400 p-4 text-amber-950 flex justify-between items-center font-black text-xl">
        <span id="modal-player-title">👤 玩家答題時間</span>
        <span id="question-type-badge" class="bg-white/90 text-amber-900 text-xs md:text-sm px-3 py-1 rounded-full font-extrabold shadow-sm">
          聽力題
        </span>
      </div>

      <div class="p-5 overflow-y-auto space-y-4 flex-1">
        <!-- 音檔播放列 -->
        <div id="audio-player-container" class="hidden bg-purple-50 p-3 rounded-2xl border-2 border-purple-200 flex flex-col items-center gap-2">
          <div class="text-purple-900 font-bold text-sm flex items-center gap-2">
            <span>🎧 聽力音檔播放：</span>
            <span id="audio-filename-tag" class="text-xs bg-purple-200 px-2.5 py-0.5 rounded-full font-mono font-bold text-purple-900">未指定音檔</span>
          </div>
          <audio id="question-audio-player" controls class="w-full max-w-md h-10"></audio>
        </div>

        <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200">
          <div id="question-text" class="text-base md:text-lg font-bold text-slate-800 leading-relaxed"></div>
        </div>

        <div id="interactive-answer-container" class="space-y-3"></div>

        <div id="answer-feedback" class="hidden p-3 rounded-2xl font-bold text-center text-sm md:text-base border transition"></div>

        <div id="hint-container" class="hidden space-y-2 pt-2 border-t border-slate-200">
          <div id="hint-buttons-wrapper" class="flex flex-col gap-2"></div>
          <div id="hint-text" class="hidden p-3 bg-purple-100 text-purple-900 border border-purple-300 rounded-xl font-bold text-sm text-center"></div>
        </div>
      </div>

      <div class="p-4 bg-slate-100 border-t border-slate-200 flex justify-end gap-3">
        <button id="submit-answer-btn" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-black text-xl rounded-2xl shadow-lg border-b-4 border-emerald-700 transition">
          🎯 確定送出答案
        </button>
      </div>
    </div>
  </div>

  <!-- 4. 購地彈窗 -->
  <div id="action-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl border-4 border-amber-400 w-full max-w-md p-6 text-center space-y-5">
      <div id="action-icon" class="text-6xl">🏡</div>
      <h3 id="action-title" class="text-2xl font-black text-slate-800">購地選擇</h3>
      <p id="action-message" class="text-lg text-slate-600 font-medium leading-relaxed"></p>
      <div id="action-buttons" class="flex gap-4 pt-2">
        <button id="action-cancel-btn" class="flex-1 py-3 bg-slate-400 hover:bg-slate-500 text-white font-black text-lg rounded-2xl shadow border-b-4 border-slate-600">不買</button>
        <button id="action-confirm-btn" class="flex-1 py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-black text-lg rounded-2xl shadow border-b-4 border-indigo-700">購買</button>
      </div>
    </div>
  </div>

  <!-- 5. 命運/機會彈窗 -->
  <div id="card-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl border-4 border-purple-400 w-full max-w-md p-6 text-center space-y-4">
      <div id="card-type-badge" class="inline-block px-4 py-1 bg-purple-100 text-purple-700 font-black rounded-full text-lg">🌟 幸運機會</div>
      <div id="card-icon" class="text-6xl my-2">🃏</div>
      <h3 id="card-title" class="text-2xl font-black text-slate-800">抽到卡片！</h3>
      <p id="card-description" class="text-lg text-slate-700 font-bold bg-amber-50 p-4 rounded-2xl border border-amber-200"></p>
      <button id="card-close-btn" class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-black text-lg rounded-2xl shadow-lg border-b-4 border-purple-800">確定</button>
    </div>
  </div>

  <!-- 6. 遊戲結束彈窗 -->
  <div id="game-over-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl border-4 border-amber-400 w-full max-w-xl p-6 text-center space-y-5">
      <div class="text-6xl animate-bounce">🏆</div>
      <h2 class="text-3xl font-black text-amber-600">遊戲結束！</h2>
      <p id="game-over-reason" class="text-slate-600 font-bold text-base bg-amber-50 py-2 px-4 rounded-xl border border-amber-200 inline-block"></p>
      <div class="space-y-3 text-left">
        <h4 class="font-bold text-slate-700 text-lg flex items-center justify-between">
          <span>📊 玩家戰績總結：</span>
        </h4>
        <div id="final-leaderboard" class="space-y-2.5 max-h-60 overflow-y-auto pr-1"></div>
      </div>
      <button id="go-home-btn" class="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white font-black text-2xl rounded-2xl shadow-xl border-b-4 border-amber-700">🏠 回到主畫面</button>
    </div>
  </div>

  <script>
    const AVATAR_OPTIONS = ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼', '🦁', '🐯'];
    const PLAYER_COLORS = [
      { name: '紅隊', bg: 'bg-rose-500', border: 'border-rose-500', text: 'text-rose-600', ring: 'ring-rose-400' },
      { name: '藍隊', bg: 'bg-blue-500', border: 'border-blue-500', text: 'text-blue-600', ring: 'ring-blue-400' },
      { name: '綠隊', bg: 'bg-emerald-500', border: 'border-emerald-500', text: 'text-emerald-600', ring: 'ring-emerald-400' },
      { name: '黃隊', bg: 'bg-amber-500', border: 'border-amber-500', text: 'text-amber-600', ring: 'ring-amber-400' },
      { name: '紫隊', bg: 'bg-purple-500', border: 'border-purple-500', text: 'text-purple-600', ring: 'ring-purple-400' },
    ];

    const DEFAULT_QUESTIONS = [
      {
        id: 1,
        type: "listening",
        typeName: "一、Listen and Choose 仔細聽",
        text: "選出正確的單字",
        audioKey: "SF5005_00287.mp3",
        options: ["(1) go home", "(2) eat lunch", "(3) eat dinner", "(4) see a doctor"],
        answer: "3",
        hint: "eat dinner"
      }
    ];

    let activeQuestionsList = [...DEFAULT_QUESTIONS];
    let uploadedAudioFiles = {}; 

    let players = [];
    let currentTurnIndex = 0;
    let boardTiles = [];
    let isRolling = false;
    let gameTimer = null;
    let remainingSeconds = 600;
    let activeQuestion = null;
    let currentLandedTileIndex = null;
    let userSelectedAnswer = null;

    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const playerCountSelect = document.getElementById('player-count-select');
    const playerInputsContainer = document.getElementById('player-inputs-container');
    const startGameBtn = document.getElementById('start-game-btn');
    const wordFileInput = document.getElementById('word-file-input');
    const mp3FilesInput = document.getElementById('mp3-files-input');
    const resetDefaultQuestionsBtn = document.getElementById('reset-default-questions-btn');
    const wordImportStatus = document.getElementById('word-import-status');
    const audioImportStatus = document.getElementById('audio-import-status');
    const boardGrid = document.getElementById('board-grid');
    const playersDashboard = document.getElementById('players-dashboard');
    const currentPlayerBadge = document.getElementById('current-player-badge');
    const timerDisplay = document.getElementById('timer-display');
    const gameLog = document.getElementById('game-log');
    const diceContainer = document.getElementById('dice-container');
    const diceCube = document.getElementById('dice-cube');

    const questionModal = document.getElementById('question-modal');
    const actionModal = document.getElementById('action-modal');
    const cardModal = document.getElementById('card-modal');
    const gameOverModal = document.getElementById('game-over-modal');

    function renderPlayerInputs() {
      const count = parseInt(playerCountSelect.value);
      playerInputsContainer.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const color = PLAYER_COLORS[i % PLAYER_COLORS.length];
        const defaultAvatar = AVATAR_OPTIONS[i % AVATAR_OPTIONS.length];
        const div = document.createElement('div');
        div.className = 'bg-white p-3 rounded-xl border-2 border-amber-200 flex items-center gap-3 shadow-sm';
        div.innerHTML = `
          <div class="w-8 h-8 rounded-full ${color.bg} text-white flex items-center justify-center font-bold text-sm">
            ${i + 1}
          </div>
          <input type="text" class="player-name-input flex-1 p-2 border border-slate-300 rounded-lg font-bold text-slate-700" value="玩家 ${i + 1}">
          <select class="player-avatar-select p-2 bg-amber-50 border border-amber-300 rounded-lg text-xl font-bold">
            ${AVATAR_OPTIONS.map((av) => `<option value="${av}" ${av === defaultAvatar ? 'selected' : ''}>${av}</option>`).join('')}
          </select>
        `;
        playerInputsContainer.appendChild(div);
      }
    }
    playerCountSelect.addEventListener('change', renderPlayerInputs);
    renderPlayerInputs();

    mp3FilesInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;
      uploadedAudioFiles = {};
      files.forEach(file => {
        uploadedAudioFiles[file.name.trim().toLowerCase()] = URL.createObjectURL(file);
      });
      audioImportStatus.className = 'text-xs font-bold text-purple-800';
      audioImportStatus.innerText = `🎧 成功讀取 ${files.length} 個音檔！`;
    });

    // Word 檔案 (.docx) 上傳讀取
    wordFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const fileArrayBuffer = event.target.result;

        // 使用 extractRawText 直接提取全部文字，不受任何表格、排版標籤干擾
        mammoth.extractRawText({ arrayBuffer: fileArrayBuffer })
          .then(result => {
            const rawText = result.value || "";
            parseDirectExamText(rawText, file.name);
          })
          .catch(err => {
            console.error("Mammoth error:", err);
            wordImportStatus.className = 'text-xs font-bold text-rose-600';
            wordImportStatus.innerText = '❌ 讀取 Word 檔案失敗，請確定檔案副檔名為 .docx';
          });
      };
      reader.readAsArrayBuffer(file);
    });

    // 核心解析引擎：直接對整份考卷文字進行正規化切分
    function parseDirectExamText(fullText, fileName) {
      if (!fullText || fullText.trim().length === 0) {
        wordImportStatus.className = 'text-xs font-bold text-rose-600';
        wordImportStatus.innerText = '❌ 檔案內容為空或無法讀取文字。';
        return;
      }

      // 將文字行切平，移除多餘空行
      const lines = fullText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      const parsedQuestions = [];
      let currentSection = 0; // 1: 聽力, 2: 選擇, 3: 填空
      let qCounter = 1;

      // 輔助函式：從字串中擷取 (1)~(4) 選項
      function parseChoices(text) {
        const matches = [...text.matchAll(/\(([1-4])\)\s*([^()《]+)/g)];
        return matches.map(m => `(${m[1]}) ${m[2].trim()}`);
      }

      // 遍歷所有行進行狀態機切分
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // 1. 判斷大題切換
        if (line.includes('一、') || line.includes('Listen and Choose')) {
          currentSection = 1;
          continue;
        } else if (line.includes('二、') || line.includes('Read and Choose')) {
          currentSection = 2;
          continue;
        } else if (line.includes('三、') || line.includes('Read and Write')) {
          currentSection = 3;
          continue;
        }

        // 2. 第一大題：聽力題 (音檔：SF5005_xxxxx.mp3...)[cite: 1]
        if (currentSection === 1 && (line.includes('音檔') || line.includes('.mp3'))) {
          const audioMatch = line.match(/音檔\s*[\:：]\s*([a-zA-Z0-9_\-]+\.mp3)/i);
          const audioFile = audioMatch ? audioMatch[1] : '';

          // 抓取選項（可能在當前行，也可能在下一行）
          let opts = parseChoices(line);
          let ans = null;
          let hint = '';

          // 檢查接下來的幾行找《答案》與《解析》[cite: 1]
          let lookAhead = 1;
          while (i + lookAhead < lines.length && lookAhead <= 4) {
            const nextL = lines[i + lookAhead];
            if (nextL.includes('音檔') || nextL.includes('二、') || nextL.includes('三、')) break;
            
            if (opts.length === 0) {
              const subOpts = parseChoices(nextL);
              if (subOpts.length > 0) opts = subOpts;
            }

            const ansM = nextL.match(/[《【\[]答案[》】\]]\s*([1-4])/);
            if (ansM) ans = ansM[1];

            const hintM = nextL.match(/[《【\[]解析[》】\]]\s*(.*)/);
            if (hintM) hint = hintM[1].trim();

            lookAhead++;
          }

          if (opts.length > 0) {
            parsedQuestions.push({
              id: qCounter++,
              type: 'listening',
              typeName: '一、Listen and Choose 仔細聽',
              text: '仔細聽，選出正確的單字：',
              audioKey: audioFile,
              options: opts,
              answer: ans || '1',
              hint: hint || '請仔細聽音檔中的發音與單字！'
            });
            i += (lookAhead - 1);
          }
          continue;
        }

        // 3. 第二大題：閱讀選擇題 ((1) xxx (2) yyy...)[cite: 1]
        if (currentSection === 2 && /\([1-4]\)/.test(line) && !line.includes('答案')) {
          let opts = parseChoices(line);
          let ans = null;

          let lookAhead = 1;
          while (i + lookAhead < lines.length && lookAhead <= 3) {
            const nextL = lines[i + lookAhead];
            if (nextL.includes('三、') || (/\([1-4]\)/.test(nextL) && !nextL.includes('答案'))) break;

            const ansM = nextL.match(/[《【\[]答案[》】\]]\s*([1-4])/);
            if (ansM) ans = ansM[1];
            lookAhead++;
          }

          if (opts.length > 0) {
            parsedQuestions.push({
              id: qCounter++,
              type: 'choice',
              typeName: '二、Read and Choose 讀一讀',
              text: '讀一讀，選出適當的回應句：',
              options: opts,
              answer: ans || '1',
              hint: '請根據對話語境選出最適當的回應！'
            });
            i += (lookAhead - 1);
          }
          continue;
        }

        // 4. 第三大題：填空題 (《答案》(It's; Tuesday))[cite: 1]
        if (currentSection === 3 && (line.includes('答案') || line.includes('《答案》'))) {
          const ansM = line.match(/[《【\[]答案[》】\]]\s*(.*)/);
          const ansText = ansM ? ansM[1].replace(/[\(\)]/g, '').trim() : '';

          parsedQuestions.push({
            id: qCounter++,
            type: 'blank',
            typeName: '三、Read and Write 讀一讀',
            text: '讀一讀，填入缺空的單字，完成對話：',
            options: [],
            answer: ansText,
            hint: `提示：共 ${ansText.split(';').length} 個單字填空`
          });
        }
      }

      // 5. 結算結果回傳
      if (parsedQuestions.length > 0) {
        activeQuestionsList = parsedQuestions;
        wordImportStatus.className = 'text-xs font-bold text-emerald-800';
        wordImportStatus.innerText = `✅ 成功讀取「${fileName}」共 ${parsedQuestions.length} 題考題！已自動生成題庫。`;
      } else {
        wordImportStatus.className = 'text-xs font-bold text-rose-600';
        wordImportStatus.innerText = '❌ 辨識完成，但未發現符合的大題題目。請確認檔案中包含「一、Listen」等字樣。';
      }
    }

    resetDefaultQuestionsBtn.addEventListener('click', () => {
      activeQuestionsList = [...DEFAULT_QUESTIONS];
      wordImportStatus.className = 'text-xs font-bold text-emerald-800';
      wordImportStatus.innerText = '✅ 已恢復為預設題庫。';
    });

    // 地圖 20 格位置配置
    const GRID_POSITIONS = [
      { r: 1, c: 1 }, { r: 1, c: 2 }, { r: 1, c: 3 }, { r: 1, c: 4 }, { r: 1, c: 5 }, { r: 1, c: 6 },
      { r: 2, c: 6 }, { r: 3, c: 6 }, { r: 4, c: 6 }, { r: 5, c: 6 },
      { r: 6, c: 6 }, 
      { r: 6, c: 5 }, { r: 6, c: 4 }, { r: 6, c: 3 }, { r: 6, c: 2 },
      { r: 6, c: 1 }, 
      { r: 5, c: 1 }, { r: 4, c: 1 }, { r: 3, c: 1 }, { r: 2, c: 1 }
    ];

    function initializeBoard() {
      boardTiles = [];
      for (let i = 0; i < 20; i++) {
        let type = 'property';
        let price = Math.floor(Math.random() * 21) * 10 + 100;
        if (i === 10) type = 'chance';
        if (i === 15) type = 'fate';
        if (i === 0) type = 'start';
        boardTiles.push({ id: i, type, price, owner: null });
      }
      renderBoard();
    }

    function renderBoard() {
      boardGrid.innerHTML = '';
      boardTiles.forEach((tile, index) => {
        const pos = GRID_POSITIONS[index];
        const tileEl = document.createElement('div');
        tileEl.id = `tile-${index}`;
        tileEl.style.gridRow = pos.r;
        tileEl.style.gridColumn = pos.c;

        let tileBg = 'bg-white';
        let borderStyle = 'border-amber-300';
        let contentHtml = '';

        if (tile.type === 'start') {
          tileBg = 'bg-emerald-100';
          contentHtml = `<span class="text-xs font-bold text-emerald-800">START</span><span class="text-xl">🚩</span>`;
        } else if (tile.type === 'chance') {
          tileBg = 'bg-purple-100';
          contentHtml = `<span class="text-xs font-bold text-purple-800">機會</span><span class="text-2xl">❓</span>`;
        } else if (tile.type === 'fate') {
          tileBg = 'bg-amber-100';
          contentHtml = `<span class="text-xs font-bold text-amber-800">命運</span><span class="text-2xl">⚡</span>`;
        } else {
          contentHtml = `<span class="text-xs md:text-sm font-black text-slate-600">$${tile.price}</span>`;
        }

        if (tile.owner !== null) {
          const owner = players[tile.owner];
          borderStyle = `${owner.color.border} border-4 shadow-md`;
          contentHtml += `<div class="absolute -top-2 -right-2 w-7 h-7 ${owner.color.bg} rounded-full text-white flex items-center justify-center text-sm shadow">${owner.avatar}</div>`;
        }

        tileEl.className = `${tileBg} border-2 ${borderStyle} rounded-2xl flex flex-col items-center justify-center relative p-1 shadow-sm transition overflow-visible`;
        tileEl.innerHTML = contentHtml;

        const avatarsOnTile = players.filter(p => p.position === index);
        if (avatarsOnTile.length > 0) {
          const avatarContainer = document.createElement('div');
          avatarContainer.className = 'absolute -bottom-2 flex gap-0.5 justify-center z-20';
          avatarsOnTile.forEach(p => {
            const badge = document.createElement('span');
            badge.className = `w-7 h-7 rounded-full ${p.color.bg} border-2 border-white text-white flex items-center justify-center text-sm font-bold shadow-lg`;
            badge.innerText = p.avatar;
            avatarContainer.appendChild(badge);
          });
          tileEl.appendChild(avatarContainer);
        }
        boardGrid.appendChild(tileEl);
      });
    }

    startGameBtn.addEventListener('click', () => {
      const nameInputs = document.querySelectorAll('.player-name-input');
      const avatarSelects = document.querySelectorAll('.player-avatar-select');
      const startMoney = parseInt(document.getElementById('start-money-input').value) || 500;
      const timeMinutes = parseInt(document.getElementById('game-time-input').value) || 10;

      players = [];
      nameInputs.forEach((input, i) => {
        players.push({
          id: i,
          name: input.value.trim() || `玩家 ${i + 1}`,
          avatar: avatarSelects[i].value,
          color: PLAYER_COLORS[i % PLAYER_COLORS.length],
          money: startMoney,
          position: 0,
          answeredQuestions: [],
          correctCount: 0,
          cards: { hint: 0, mutual: 0 }
        });
      });

      remainingSeconds = timeMinutes * 60;
      currentTurnIndex = 0;

      startScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      gameScreen.classList.add('flex');

      initializeBoard();
      updateDashboard();
      startTimer();
      logMessage(`🎮 遊戲開始！每位玩家分配資金 $${startMoney}。`, 'emerald');
    });

    function startTimer() {
      if (gameTimer) clearInterval(gameTimer);
      gameTimer = setInterval(() => {
        remainingSeconds--;
        const mins = Math.floor(remainingSeconds / 60);
        const secs = remainingSeconds % 60;
        timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (remainingSeconds <= 0) {
          clearInterval(gameTimer);
          endGame('時間結束！');
        }
      }, 1000);
    }

    function updateDashboard() {
      const currentPlayer = players[currentTurnIndex];
      currentPlayerBadge.className = `px-4 py-2 rounded-xl text-white font-bold text-lg flex items-center gap-2 shadow ${currentPlayer.color.bg}`;
      currentPlayerBadge.innerHTML = `<span>${currentPlayer.avatar}</span> <span>${currentPlayer.name}</span> <span class="bg-white/20 px-2 py-0.5 rounded-lg text-sm">$${currentPlayer.money}</span>`;

      playersDashboard.innerHTML = '';
      players.forEach((p, idx) => {
        const isCurrent = idx === currentTurnIndex;
        const card = document.createElement('div');
        card.className = `px-3 py-1.5 rounded-xl border-2 font-bold text-xs md:text-sm flex items-center gap-1.5 shadow-sm transition ${isCurrent ? `${p.color.border} bg-amber-100 ring-2${p.color.ring} scale-105` : 'border-slate-200 bg-white opacity-80'}`;
        card.innerHTML = `
          <span>${p.avatar}</span>
          <span class="text-slate-700">${p.name}</span>
          <span class="font-black ${p.color.text}">$${p.money}</span>
          ${(p.cards.hint > 0 || p.cards.mutual > 0) ? '<span class="text-xs">🃏</span>' : ''}
        `;
        playersDashboard.appendChild(card);
      });
      renderBoard();
    }

    function logMessage(msg, color = 'slate') {
      const div = document.createElement('div');
      div.className = `py-0.5 text-${color}-600 font-medium`;
      div.innerHTML = `• ${msg}`;
      gameLog.appendChild(div);
      gameLog.scrollTop = gameLog.scrollHeight;
    }

    diceContainer.addEventListener('click', rollDice);

    function rollDice() {
      if (isRolling) return;
      isRolling = true;
      const player = players[currentTurnIndex];
      const steps = Math.floor(Math.random() * 6) + 1;

      const rotations = {
        1: { x: 0, y: 0 },
        2: { x: 0, y: -90 },
        3: { x: 0, y: -180 },
        4: { x: 0, y: 90 },
        5: { x: -90, y: 0 },
        6: { x: 90, y: 0 }
      };

      const targetRot = rotations[steps];
      const extraSpinX = (Math.floor(Math.random() * 3) + 2) * 360;
      const extraSpinY = (Math.floor(Math.random() * 3) + 2) * 360;
      diceCube.style.transform = `rotateX(${targetRot.x + extraSpinX}deg) rotateY(${targetRot.y + extraSpinY}deg)`;

      logMessage(`${player.avatar} ${player.name} 擲出了 <b>${steps}</b> 點！`, 'amber');
      setTimeout(() => {
        isRolling = false;
        movePlayer(player, steps);
      }, 1250);
    }

    function movePlayer(player, steps) {
      let currentStep = 0;
      const interval = setInterval(() => {
        player.position = (player.position + 1) % 20;
        currentStep++;
        renderBoard();

        if (currentStep >= steps) {
          clearInterval(interval);
          handleTileLanding(player, player.position);
        }
      }, 250);
    }

    function handleTileLanding(player, tileIndex) {
      currentLandedTileIndex = tileIndex;
      const tile = boardTiles[tileIndex];

      if (tile.type === 'fate') {
        const moves = [1, 2, -1, -2];
        const move = moves[Math.floor(Math.random() * moves.length)];
        const text = move > 0 ? `前進 ${move} 格` : `後退 ${Math.abs(move)} 格`;
        showCardModal('⚡ 命運觸發！', '🎲 命運卡片', text, () => {
          player.position = (player.position + move + 20) % 20;
          renderBoard();
          triggerQuestionModal(player);
        });
      } else if (tile.type === 'chance') {
        const cards = [
          { type: 'hint', title: '💡 老師提示卡', desc: '答題時可獲得提示！' },
          { type: 'mutual', title: '🤝 守望相助卡', desc: '答題時可請同學提示！' }
        ];
        const chosen = cards[Math.floor(Math.random() * cards.length)];
        if (chosen.type === 'hint') player.cards.hint++;
        if (chosen.type === 'mutual') player.cards.mutual++;

        showCardModal('🌟 機會卡牌！', chosen.title, chosen.desc, () => {
          nextTurn();
        });
      } else {
        triggerQuestionModal(player);
      }
    }

    function showCardModal(badge, title, desc, onClose) {
      document.getElementById('card-type-badge').innerText = badge;
      document.getElementById('card-title').innerText = title;
      document.getElementById('card-description').innerText = desc;
      cardModal.classList.remove('hidden');
      cardModal.classList.add('flex');

      const closeBtn = document.getElementById('card-close-btn');
      const handler = () => {
        cardModal.classList.add('hidden');
        cardModal.classList.remove('flex');
        closeBtn.removeEventListener('click', handler);
        if (onClose) onClose();
      };
      closeBtn.addEventListener('click', handler);
    }

    // 題目彈窗互動
    function triggerQuestionModal(player) {
      let availableQuestions = activeQuestionsList.filter(q => !player.answeredQuestions.includes(q.id));
      if (availableQuestions.length === 0) {
        player.answeredQuestions = [];
        availableQuestions = activeQuestionsList;
      }

      activeQuestion = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
      player.answeredQuestions.push(activeQuestion.id);
      userSelectedAnswer = null;

      document.getElementById('modal-player-title').innerText = `👤 ${player.avatar} ${player.name} 答題中`;
      document.getElementById('question-type-badge').innerText = activeQuestion.typeName;

      const audioContainer = document.getElementById('audio-player-container');
      const audioPlayer = document.getElementById('question-audio-player');
      const audioTag = document.getElementById('audio-filename-tag');

      if (activeQuestion.type === 'listening') {
        audioContainer.classList.remove('hidden');
        const key = (activeQuestion.audioKey || "").toLowerCase();
        const matchedAudio = uploadedAudioFiles[key] || uploadedAudioFiles[key.replace('.mp3', '')];

        audioTag.innerText = activeQuestion.audioKey || "未指定音檔";

        if (matchedAudio) {
          audioPlayer.src = matchedAudio;
          audioPlayer.load();
          audioPlayer.play().catch(() => {});
        } else {
          audioPlayer.removeAttribute('src');
          audioTag.innerText += " (未上傳對應 MP3 音檔)";
        }
      } else {
        audioContainer.classList.add('hidden');
        audioPlayer.pause();
        audioPlayer.removeAttribute('src');
      }

      document.getElementById('question-text').innerHTML = activeQuestion.text;

      renderInteractiveContainer(activeQuestion);

      const feedbackBox = document.getElementById('answer-feedback');
      feedbackBox.className = 'hidden p-3 rounded-2xl font-bold text-center text-sm md:text-base border transition';
      
      const submitBtn = document.getElementById('submit-answer-btn');
      submitBtn.disabled = false;

      setupHintCards(player, activeQuestion);

      questionModal.classList.remove('hidden');
      questionModal.classList.add('flex');
    }

    function renderInteractiveContainer(q) {
      const container = document.getElementById('interactive-answer-container');
      container.innerHTML = '';

      if (q.type === 'blank') {
        const box = document.createElement('div');
        box.className = 'bg-amber-50/60 p-4 rounded-2xl border border-amber-200 flex flex-col gap-2';
        box.innerHTML = `
          <label class="font-bold text-slate-700 text-sm">請輸入缺空的單字 (多個單字請以分號 ; 分隔)：</label>
          <input type="text" id="blank-answer-input" class="w-full p-3 bg-white border-2 border-amber-300 rounded-xl font-bold text-lg text-slate-800 focus:outline-none" placeholder="例如: It's; Tuesday">
        `;
        container.appendChild(box);
      } else {
        const options = q.options && q.options.length > 0 ? q.options : ["(1) 選項 1", "(2) 選項 2", "(3) 選項 3", "(4) 選項 4"];
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-2.5';

        options.forEach((optText) => {
          const btn = document.createElement('button');
          const matchNum = optText.match(/\(([1-4])\)/);
          const optValue = matchNum ? matchNum[1] : '1';
          
          btn.type = 'button';
          btn.className = 'opt-btn text-left p-3.5 bg-white hover:bg-amber-100 border-2 border-slate-300 hover:border-amber-400 rounded-2xl font-bold text-slate-800 transition shadow-sm flex items-center justify-between';
          btn.innerHTML = `<span>${optText}</span>`;
          
          btn.onclick = () => {
            document.querySelectorAll('.opt-btn').forEach(b => {
              b.classList.remove('bg-amber-200', 'border-amber-500', 'ring-2', 'ring-amber-400');
              b.classList.add('bg-white');
            });
            btn.classList.remove('bg-white');
            btn.classList.add('bg-amber-200', 'border-amber-500', 'ring-2', 'ring-amber-400');
            userSelectedAnswer = optValue;
          };
          grid.appendChild(btn);
        });
        container.appendChild(grid);
      }
    }

    function setupHintCards(player, q) {
      const hintContainer = document.getElementById('hint-container');
      const hintButtonsWrapper = document.getElementById('hint-buttons-wrapper');
      const hintText = document.getElementById('hint-text');

      hintText.classList.add('hidden');
      hintButtonsWrapper.innerHTML = '';
      let hasCard = false;

      if (player.cards.hint > 0) {
        hasCard = true;
        const btn = document.createElement('button');
        btn.className = 'w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow transition text-base';
        btn.innerHTML = '💡 使用「老師提示卡」';
        btn.onclick = () => {
          player.cards.hint--;
          hintText.innerText = `📢 提示：${q.hint || "請仔細確認關鍵字！"}`;
          hintText.classList.remove('hidden');
          btn.remove();
          updateDashboard();
        };
        hintButtonsWrapper.appendChild(btn);
      }

      if (player.cards.mutual > 0) {
        hasCard = true;
        const btn = document.createElement('button');
        btn.className = 'w-full py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-xl shadow transition text-base';
        btn.innerHTML = '🤝 使用「守望相助卡」';
        btn.onclick = () => {
          player.cards.mutual--;
          hintText.innerText = '📢 已使用守望相助卡！可請同組同學協助。';
          hintText.classList.remove('hidden');
          btn.remove();
          updateDashboard();
        };
        hintButtonsWrapper.appendChild(btn);
      }

      hintContainer.className = hasCard ? 'space-y-2 pt-2 border-t border-slate-200' : 'hidden';
    }

    document.getElementById('submit-answer-btn').addEventListener('click', () => {
      const q = activeQuestion;
      let playerAns = userSelectedAnswer;

      if (q.type === 'blank') {
        const input = document.getElementById('blank-answer-input');
        if (input) playerAns = input.value.trim();
      }

      if (!playerAns) {
        alert("請先選擇或輸入答案！");
        return;
      }

      // 比對答案邏輯
      const cleanCorrect = String(q.answer || "").replace(/[\(\)\s]/g, '').toLowerCase();
      const cleanUser = String(playerAns).replace(/[\(\)\s]/g, '').toLowerCase();
      const isCorrect = (cleanUser === cleanCorrect);

      const feedbackBox = document.getElementById('answer-feedback');
      const submitBtn = document.getElementById('submit-answer-btn');
      submitBtn.disabled = true;

      const audioPlayer = document.getElementById('question-audio-player');
      audioPlayer.pause();

      if (isCorrect) {
        feedbackBox.className = 'p-3 bg-emerald-100 text-emerald-900 border-2 border-emerald-400 rounded-2xl font-bold text-center text-lg';
        feedbackBox.innerText = '🎉 恭喜答對！獲得 $100 獎勵金與購地權！';
      } else {
        feedbackBox.className = 'p-3 bg-rose-100 text-rose-900 border-2 border-rose-400 rounded-2xl font-bold text-center text-lg';
        feedbackBox.innerText = `❌ 答錯囉！正確答案是：(${q.answer || "無標註"})`;
      }
      feedbackBox.classList.remove('hidden');

      setTimeout(() => {
        questionModal.classList.add('hidden');
        questionModal.classList.remove('flex');
        handleAnswerResult(isCorrect);
      }, 1600);
    });

    function handleAnswerResult(isCorrect) {
      const player = players[currentTurnIndex];
      const tile = boardTiles[currentLandedTileIndex];

      if (isCorrect) {
        player.correctCount++;
        player.money += 100;
        logMessage(`⭕ ${player.avatar} ${player.name} 答對題目！獲得獎勵 $100！`, 'emerald');

        if (tile.type === 'property') {
          if (tile.owner === null) {
            promptLandPurchase(player, tile);
          } else if (tile.owner !== player.id) {
            payRent(player, tile);
          } else {
            nextTurn();
          }
        } else {
          nextTurn();
        }
      } else {
        logMessage(`❌ ${player.avatar} ${player.name} 答錯題目！`, 'rose');
        showCardModal('💙 溫馨鼓勵', '再接再厲！', '沒關係，下次再接再厲就好！', () => {
          if (tile.type === 'property' && tile.owner !== null && tile.owner !== player.id) {
            payRent(player, tile);
          } else {
            nextTurn();
          }
        });
      }
    }

    function promptLandPurchase(player, tile) {
      if (player.money < tile.price) {
        showCardModal('⚠ 購地提醒', '現金不足', `本格需要 $${tile.price}，持有現金不足無法購買。`, () => {
          nextTurn();
        });
        return;
      }

      document.getElementById('action-title').innerText = '🏠 取得購地權';
      document.getElementById('action-message').innerHTML = `恭喜答對！這是一塊無主地。<br>購地價格為 <b class="text-amber-600 text-xl">$${tile.price}</b>，要購買嗎？`;
      document.getElementById('action-confirm-btn').innerText = `買 ($${tile.price})`;

      actionModal.classList.remove('hidden');
      actionModal.classList.add('flex');

      const confirmBtn = document.getElementById('action-confirm-btn');
      const cancelBtn = document.getElementById('action-cancel-btn');

      const handleBuy = () => {
        actionModal.classList.add('hidden');
        actionModal.classList.remove('flex');
        player.money -= tile.price;
        tile.owner = player.id;
        logMessage(`🎉 ${player.avatar} ${player.name} 買下了此地產！`, 'indigo');
        cleanup();
        nextTurn();
      };

      const handleSkip = () => {
        actionModal.classList.add('hidden');
        actionModal.classList.remove('flex');
        cleanup();
        nextTurn();
      };

      function cleanup() {
        confirmBtn.removeEventListener('click', handleBuy);
        cancelBtn.removeEventListener('click', handleSkip);
      }

      confirmBtn.addEventListener('click', handleBuy);
      cancelBtn.addEventListener('click', handleSkip);
    }

    function payRent(player, tile) {
      const owner = players[tile.owner];
      const rent = tile.price;
      player.money -= rent;
      owner.money += rent;

      logMessage(`💸 ${player.avatar} ${player.name} 付給 ${owner.avatar} ${owner.name} 過路費 $${rent}！`, 'rose');

      if (player.money <= 0) {
        endGame(`${player.avatar} ${player.name} 破產！`);
      } else {
        nextTurn();
      }
    }

    function nextTurn() {
      updateDashboard();
      const bankruptPlayer = players.find(p => p.money <= 0);
      if (bankruptPlayer) {
        endGame(`${bankruptPlayer.avatar} ${bankruptPlayer.name} 現金歸零！`);
        return;
      }
      currentTurnIndex = (currentTurnIndex + 1) % players.length;
      updateDashboard();
      logMessage(`👉 輪到 ${players[currentTurnIndex].avatar} <b>${players[currentTurnIndex].name}</b> 擲骰子。`, 'amber');
    }

    function endGame(reason) {
      if (gameTimer) clearInterval(gameTimer);
      document.getElementById('game-over-reason').innerText = `結算原因：${reason}`;
      const leaderboard = document.getElementById('final-leaderboard');
      leaderboard.innerHTML = '';

      players.forEach(p => {
        const ownedProps = boardTiles.filter(t => t.type === 'property' && t.owner === p.id).length;
        const item = document.createElement('div');
        item.className = 'p-3 bg-slate-50 rounded-2xl border-2 border-slate-200 flex items-center justify-between font-bold text-sm shadow-sm';
        item.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-2xl">${p.avatar}</span>
            <span class="text-slate-800">${p.name}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-amber-900 bg-amber-100 px-2 py-1 rounded-xl">地產：${ownedProps}</span>
            <span class="text-xs text-emerald-900 bg-emerald-100 px-2 py-1 rounded-xl">答對：${p.correctCount || 0}</span>
            <span class="text-xs text-indigo-900 bg-indigo-100 px-2 py-1 rounded-xl">資產：$${p.money}</span>
          </div>
        `;
        leaderboard.appendChild(item);
      });

      gameOverModal.classList.remove('hidden');
      gameOverModal.classList.add('flex');
    }

    document.getElementById('go-home-btn').addEventListener('click', () => {
      if (gameTimer) clearInterval(gameTimer);
      players = [];
      boardTiles = [];
      gameOverModal.classList.add('hidden');
      gameScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
      renderPlayerInputs();
    });
  </script>
</body>
</html>
